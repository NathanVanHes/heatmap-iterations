<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session End - Noon Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}
:root{
  --bg:#F8F5EF;
  --bg-raised:#FFFFFF;
  --fg:#141414;
  --fg-secondary:#74716C;
  --fg-muted:#BBB8B1;
  --green:#27BD86;
  --gold:#FFCB45;
  --red:#F03D3D;
  --font-sans:'Inter',system-ui,sans-serif;
  --font-mono:'Inter',system-ui,sans-serif;
  --r:8px;
}
body{background:var(--bg);margin:0;font-family:var(--font-sans);color:var(--fg);min-height:100vh}
.page{max-width:480px;margin:0 auto;padding:32px 24px}
.section{margin-bottom:28px;opacity:0;transform:translateY(6px);animation:cardIn 0.35s ease forwards}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}

.topic{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(20,20,20,0.06)}
.topic:last-child{border-bottom:0}
.topic__tile{width:44px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none;position:relative;overflow:hidden}
.topic__tile-score{font-family:var(--font-mono);font-size:14px;font-weight:700;color:rgba(0,0,0,0.35)}
.topic__tile.is-mastered::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0.15;background:repeating-linear-gradient(135deg,transparent,transparent 5px,rgba(0,0,0,0.4) 5px,rgba(0,0,0,0.4) 6.5px);border-radius:inherit}
.topic__info{flex:1;min-width:0}
.topic__name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic__sub{font-size:12px;color:var(--fg-secondary);margin-top:2px;font-family:var(--font-mono);display:flex;align-items:center;gap:3px}

.gbar{position:relative;margin-top:10px}
.gbar__track{width:100%;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--gold),var(--green));opacity:0.2}
.gbar__line{position:absolute;top:4px;transform:translateY(-50%);height:3px;border-radius:1.5px;z-index:1}
.gbar__start{position:absolute;top:4px;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px rgba(20,20,20,0.15);z-index:2}
.gbar__pos{position:absolute;top:4px;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;border:2.5px solid var(--bg);box-shadow:0 0 0 1px rgba(20,20,20,0.15),0 1px 3px rgba(0,0,0,0.15);z-index:3;transition:left 0.8s cubic-bezier(0.22,0.61,0.36,1)}
.gbar__target{position:absolute;top:0;height:8px;width:2px;background:var(--fg);border-radius:1px;opacity:0.2}
.gbar__labels{display:flex;margin-top:6px;position:relative}
.gbar__labels span{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
.gbar__mastery-label{position:absolute;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--fg-secondary);display:flex;align-items:center;gap:2px}
.gbar__gain-label{position:absolute;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--green)}
</style>
</head>
<body>
<div class="page">
  <div id="content"></div>
</div>

<script>
var crownInline = '<svg width="10" height="7" viewBox="0 0 13 9" fill="#141414" style="vertical-align:-1px"><path d="M11.6935 8.06452H0.806452L0 1.6129L3.22581 4.03226L6.45161 0L9.67742 4.03226L12.5 1.6129L11.6935 8.06452Z"/></svg>';
var crownSvg14 = '<svg width="14" height="9" viewBox="0 0 13 9" fill="#141414"><path d="M11.6935 8.06452H0.806452L0 1.6129L3.22581 4.03226L6.45161 0L9.67742 4.03226L12.5 1.6129L11.6935 8.06452Z"/></svg>';
var mastery = 80;

function scoreColor(s) {
  var t = Math.max(0, Math.min(100, s)) / 100;
  var r, g, b;
  if (t < 0.5) { var p = t / 0.5; r = 240+(255-240)*p; g = 61+(203-61)*p; b = 61+(69-61)*p; }
  else { var p = (t-0.5)/0.5; r = 255+(39-255)*p; g = 203+(189-203)*p; b = 69+(134-69)*p; }
  return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
}

function renderTopicWithBar(t) {
  var col = scoreColor(t.score);
  var startCol = scoreColor(t.startScore);
  var gap = mastery - t.score;
  var isMastered = t.score >= mastery;
  var gain = t.score - t.startScore;

  var h = '<div class="topic">';

  if (isMastered) {
    h += '<div class="topic__tile is-mastered" style="background:' + col + '">' + crownSvg14 + '</div>';
  } else {
    h += '<div class="topic__tile" style="background:' + col + '"><span class="topic__tile-score">' + t.score + '</span></div>';
  }

  h += '<div class="topic__info">';
  h += '<div class="topic__name">' + t.name + '</div>';

  if (isMastered) {
    h += '<div class="topic__sub">' + crownInline + ' Mastered</div>';
  } else {
    h += '<div class="topic__sub">Reach ' + crownInline + ' 80+</div>';
  }

  // Gradient bar
  h += '<div class="gbar">';
  h += '<div class="gbar__track"></div>';

  // Connecting line between start and current
  h += '<div class="gbar__line" style="left:' + t.startScore + '%;width:' + (t.score - t.startScore) + '%;background:' + col + '"></div>';

  // Small start marker
  h += '<div class="gbar__start" style="left:' + t.startScore + '%;background:' + startCol + '"></div>';

  // Large current position marker
  h += '<div class="gbar__pos" style="left:' + t.score + '%;background:' + col + '"></div>';

  if (!isMastered) {
    h += '<div class="gbar__target" style="left:' + mastery + '%"></div>';
  }

  h += '<div class="gbar__labels">';
  if (!isMastered) {
    h += '<span class="gbar__mastery-label" style="left:' + mastery + '%">' + crownInline + ' ' + mastery + '</span>';
  }
  if (gain > 0) {
    h += '<span class="gbar__gain-label" style="left:' + t.score + '%">+' + gain + '</span>';
  }
  h += '</div>';

  h += '</div>';
  h += '</div></div>';
  return h;
}

// startScore = where they were at session start, score = where they are now
var topics = [
  { name: 'المستقيمات', startScore: 18, score: 29 },
  { name: 'القوى', startScore: 35, score: 48 },
  { name: 'الاعداد و خصائصها', startScore: 72, score: 81 },
  { name: 'النسبة والتناسب', startScore: 78, score: 84 },
  { name: 'الإحصاء', startScore: 94, score: 97 },
];

var h = '';
topics.forEach(function(t, i) {
  h += '<div class="section" style="animation-delay:' + (i * 80) + 'ms">';
  h += renderTopicWithBar(t);
  h += '</div>';
});

document.getElementById('content').innerHTML = h;
</script>
</body>
</html>
